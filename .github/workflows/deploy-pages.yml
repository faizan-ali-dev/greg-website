name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website for the published URL
        run: node build.mjs
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
      - name: Check generated pages and JavaScript
        run: |
          node verify.mjs
          node --check src/site.js
          node --check src/assistant.js
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
